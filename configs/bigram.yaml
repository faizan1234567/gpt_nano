# configs to develop and train a bigram language model

# training settings
training:
  batch_size: 64
  lr: 0.0003
  iterations: 5000
  train: True
  eval_iters: 100
  eval_interval: 200
  train_model: bigram
  compile: False

# dataset settings
dataset:
  vocab_size: 65
  train_split: 0.9
  fname: dataset/input.txt

# inference 
inference:
  max_new_tokens: 500

general:
  log: INFO
  block_size: 256
  save_ckpt: weights



